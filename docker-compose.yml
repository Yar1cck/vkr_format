name: vkr-format

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vkr}
      POSTGRES_USER: ${POSTGRES_USER:-vkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vkr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vkr} -d ${POSTGRES_DB:-vkr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./docs/normative:/app/docs/normative:ro
    # Фоновые задачи violations.py (finalize+preview) выполняются в API-процессе,
    # поэтому unoserver нужен и здесь. Запускаем свой инстанс LO параллельно.
    command:
      - "/bin/sh"
      - "-c"
      - |
        PYTHONPATH=/usr/lib/python3/dist-packages \
        URE_BOOTSTRAP=file:///usr/lib/libreoffice/program/fundamentalrc \
        unoserver --interface 127.0.0.1 --port 2002 --uno-port 2003 &
        sleep 12
        exec env UNOSERVER_PORT=2002 \
          uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      # /health отвечает 200 как только лифстайл-инициализация (миграции +
      # стартовая БД-синхронизация) закончилась. Без этого nginx стартовал
      # раньше API и кешировал DNS-резолв пустого ответа.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # unoserver держит LibreOffice прогретым — eliminates ~3-5s per LO startup.
    # При любой ошибке unoconvert возвращает False и код откатывается на soffice.
    # sleep 12: LO стартует ~5–10 с; exec заменяет shell на celery (PID 1).
    command:
      - "/bin/sh"
      - "-c"
      - |
        PYTHONPATH=/usr/lib/python3/dist-packages \
        URE_BOOTSTRAP=file:///usr/lib/libreoffice/program/fundamentalrc \
        unoserver --interface 127.0.0.1 --port 2002 --uno-port 2003 &
        sleep 12
        exec env UNOSERVER_PORT=2002 \
          celery -A services.worker.app.celery_app:celery_app worker --loglevel=INFO
    # Лимит памяти — защита от подвисшего LibreOffice/PIL на больших docx.
    # Без mem_limit один зловредный документ мог выжрать всю RAM хоста,
    # и OOM-killer убил бы Postgres (катастрофа для всех остальных).
    # 2G — с запасом для unoserver (держит LO в памяти) + 50 MB docx.
    mem_limit: 2g
    memswap_limit: 2g

  # Отдельный beat-процесс гоняет периодические задачи (cleanup expired docs).
  # Должен быть ровно один в кластере — иначе задачи запустятся дважды.
  worker_beat:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "services.worker.app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    mem_limit: 512m

  frontend:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.frontend
    env_file: .env
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27
    depends_on:
      api:
        # nginx стартует ТОЛЬКО когда api отвечает 200 на /health.
        # Иначе на cold start nginx закешировал бы DNS-сбой и продолжал
        # отдавать 502 даже после того, как api уже поднялся.
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  minio-data:
